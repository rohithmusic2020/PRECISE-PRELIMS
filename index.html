<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Prelims Precise — March 2025 (50 Qs)</title>
<style>
  :root{
    --bg:#f6f8fa; --card:#ffffff; --accent:#0b6cf0; --muted:#6b7280;
    --success:#16a34a; --danger:#dc2626; --border:#e6eef9;
  }
  *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
  body{margin:0;background:var(--bg);color:#0b1220;line-height:1.45}
  .wrap{max-width:980px;margin:28px auto;padding:20px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  header img{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,#e6f0ff,#dbeefe);display:flex;align-items:center;justify-content:center}
  header h1{margin:0;font-size:20px}
  .card{background:var(--card); border-radius:10px;padding:18px;box-shadow:0 6px 20px rgba(13,38,76,0.06);border:1px solid var(--border)}
  .muted{color:var(--muted);font-size:13px}
  .start-box{display:grid;gap:12px;align-items:center}
  input[type="text"]{padding:10px;border-radius:8px;border:1px solid #dbe6f5;background:transparent;color:inherit;outline:none;width:100%}
  button{background:var(--accent);border:none;color:white;padding:10px 14px;border-radius:9px;font-weight:600;cursor:pointer}
  button.secondary{background:#eef6ff;color:var(--accent);border:1px solid #dbeefe}
  .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .timer{font-weight:700;padding:6px 10px;border-radius:8px;background:#eef6ff;color:var(--accent);border:1px solid #dbeefe}
  .qbox{margin-top:18px}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .qnum{font-weight:700;color:var(--accent)}
  .question{margin:10px 0 12px}
  .opts{display:grid;gap:10px;margin-top:8px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:8px;border:1px solid #f0f4fb;background:#fbfdff}
  .opt input{margin-top:4px}
  .footer{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
  .small{font-size:13px;color:var(--muted)}
  .result{margin-top:18px;padding:12px;border-radius:10px}
  .correct{background:rgba(22,163,74,0.08);color:var(--success);border:1px solid rgba(22,163,74,0.12)}
  .wrong{background:rgba(220,38,38,0.06);color:var(--danger);border:1px solid rgba(220,38,38,0.10)}
  .review{margin-top:12px}
  pre{white-space:pre-wrap;font-family:monospace;font-size:13px;color:var(--muted);padding:12px;background:#fbfdff;border-radius:8px;overflow:auto;border:1px solid #eef6ff}
  @media(max-width:700px){.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img aria-hidden="true"><svg width="0" height="0" style="position:absolute;left:-9999px"></svg>
    <div>
      <h1>Prelims Precise — March 2025 (50 Questions)</h1>
      <div class="muted">Source: March 2025 Prelims Precise (Fortune IAS). :contentReference[oaicite:1]{index=1}</div>
    </div>
  </header>

  <div id="entry" class="card start-box">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="flex:1">
        <div class="small">Enter your name to begin</div>
        <input id="username" type="text" placeholder="Full name (required)" />
      </div>
      <div class="meta">
        <div class="timer" id="previewTimer">Time: 60:00</div>
        <div class="small">50 questions — Auto submit after 60 minutes</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px">
      <button id="startBtn">Start Quiz</button>
    </div>
  </div>

  <div id="quiz" class="card" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="qhead">
        <div class="qnum">Q <span id="currentIndex">1</span> / 50</div>
        <div class="small" id="qType"> </div>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <div class="timer" id="timer">60:00</div>

    </div>

    <div id="questionArea" class="qbox"></div>

      </div>

      </div>
    </div>
  </div>

  <div id="resultArea" style="display:none">
    <div class="card result" id="scoreBox"></div>
    <div class="card review" id="reviewBox"></div>
  </div>

</div>

/* Helpers */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* App state */
let state = { user:null, order:[], idx:0, answers:{}, startedAt:null, timerSec:3600, timerInterval:null };

/* DOM */
const entry = document.getElementById('entry');
const quiz = document.getElementById('quiz');
const questionArea = document.getElementById('questionArea');
const currentIndex = document.getElementById('currentIndex');
const timerEl = document.getElementById('timer');
const previewTimer = document.getElementById('previewTimer');
const userDisplay = document.getElementById('userDisplay');
const answeredCount = document.getElementById('answeredCount');
const qType = document.getElementById('qType');

document.getElementById('startBtn').addEventListener('click', startQuiz);
document.getElementById('nextBtn').addEventListener('click', ()=>changeQuestion(1));
document.getElementById('prevBtn').addEventListener('click', ()=>changeQuestion(-1));
document.getElementById('submitBtn').addEventListener('click', submitQuiz);

function startQuiz(){
  const name = document.getElementById('username').value.trim();
  if(!name){ alert('Please enter your name to start'); return; }
  state.user = name;
  userDisplay.textContent = name;
  state.order = shuffle(QUESTIONS.slice());
  state.idx = 0; state.answers = {}; state.startedAt = Date.now();
  entry.style.display='none'; quiz.style.display='block';
  renderQuestion();
  state.timerSec = 3600; updateTimer(state.timerSec);
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(()=>{
    state.timerSec--;
    updateTimer(state.timerSec);
    if(state.timerSec<=0){ clearInterval(state.timerInterval); autoSubmit(); }
  },1000);
}

function updateTimer(sec){
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  timerEl.textContent = `${m}:${s}`;
  previewTimer.textContent = `Time: ${m}:${s}`;
}

function renderQuestion(){
  const qObj = state.order[state.idx];
  currentIndex.textContent = state.idx+1;
  qType.textContent = '';
  let html = `<div class="question"><div style="font-weight:600">${qObj.q.replace(/\n/g,'<br>')}</div></div>`;
  if(qObj.statements && qObj.type!=='howmany'){
    html += '<div class="small muted" style="margin-top:6px">Statements:</div><div style="margin-top:6px">';
    qObj.statements.forEach((st,si)=> html += `<div style="margin:4px 0;margin-left:8px">${si+1}. ${st}</div>`);
    html += '</div>';
    qType.textContent = 'Choose the correct option';
  } else if(qObj.type==='howmany'){
    html += '<div class="small muted" style="margin-top:6px">Statements:</div><div style="margin-top:6px">';
    qObj.statements.forEach((st,si)=> html += `<div style="margin:4px 0;margin-left:8px">${si+1}. ${st}</div>`);
    html += '</div>';
    qType.textContent = 'How many of the above are correct?';
  }
  html += '<div class="opts">';
  qObj.options.forEach((opt,oi)=>{
    const checked = (state.answers[qObj.id]===oi)?'checked':'';
    html += `<label class="opt"><input type="radio" name="opt" data-id="${qObj.id}" value="${oi}" ${checked}/> <div>${String.fromCharCode(65+oi)}. ${opt}</div></label>`;
  });
  html += '</div>';
  questionArea.innerHTML = html;

  document.querySelectorAll('input[name="opt"]').forEach(r=>{
    r.addEventListener('change', (e)=>{
      const id = Number(e.target.dataset.id), val = Number(e.target.value);
      state.answers[id] = val;
      updateAnsweredCount();
    });
  });
  updateAnsweredCount();
}

function changeQuestion(dir){
  let ni = state.idx + dir;
  if(ni<0||ni>=state.order.length) return;
  state.idx = ni; renderQuestion();
}

function updateAnsweredCount(){
  answeredCount.textContent = Object.keys(state.answers).length;
}

function autoSubmit(){
  alert("Time's up — quiz will be auto-submitted now.");
  submitQuiz();
}

function submitQuiz(){
  if(!confirm("Submit quiz now? You will receive score and review.")) return;
  clearInterval(state.timerInterval);
  const total = QUESTIONS.length;
  let correct = 0, attempted = 0;
  const review = state.order.map((qObj, idx)=>{
    const user = state.answers[qObj.id];
    if(typeof user !== 'undefined') attempted++;
    const isCorrect = (typeof user !== 'undefined' && user === qObj.answer);
    if(isCorrect) correct++;
    return {no:idx+1, q:qObj.q, type:qObj.type, statements:qObj.statements||null, options:qObj.options, user:user, key:qObj.answer, correct:isCorrect};
  });
  const wrong = attempted - correct;
  const unattempted = total - attempted;
  const score = correct;

  // display results
  quiz.style.display='none';
  document.getElementById('resultArea').style.display='block';
  const scoreBox = document.getElementById('scoreBox');
  scoreBox.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div><h3 style="margin:0">${state.user} — Result</h3><div class="small">Total Questions: ${total} | Attempted: ${attempted}</div></div>
    <div style="font-weight:600">Correct: ${correct} | Wrong: ${wrong} | Unattempted: ${unattempted} | Score: ${score}/${total}</div>
  </div>`;

  // review panel
  const reviewBox = document.getElementById('reviewBox');
  let html = `<h4 style="margin:0 0 12px 0">Review</h4>`;
  review.forEach(r=>{
    html += `<div style="padding:10px;border-radius:8px;background:#fbfdff;border:1px solid #eef6ff;margin-bottom:10px">`;
    html += `<div style="display:flex;justify-content:space-between"><div><strong>Q${r.no}.</strong></div><div>${r.correct?'<span style="color:var(--success)">Correct</span>':'<span style="color:var(--danger)">Wrong</span>'}</div></div>`;
    html += `<div style="margin-top:8px">${r.q.replace(/\n/g,'<br>')}</div>`;
    if(r.statements){
      html += `<div class="small muted" style="margin-top:8px">Statements:</div>`;
      r.statements.forEach((s,si)=> html += `<div style="margin-left:8px">${si+1}. ${s}</div>`);
    }
    html += `<div style="margin-top:8px">`;
    r.options.forEach((o,oi)=>{
      const marker = (r.key===oi)?' ← Answer':'';
      const you = (r.user===oi)?' ← You':'';
      html += `<div style="margin-top:6px"${r.key===oi?' style="font-weight:700"':''}>${String.fromCharCode(65+oi)}. ${o}${marker}${you}</div>`;
    });
    html += `</div></div>`;
  });
  reviewBox.innerHTML = html;

  // export
  const exportBtn = document.createElement('button');
  exportBtn.textContent = 'Download attempt JSON';
  exportBtn.style.marginTop='10px';
  exportBtn.onclick = ()=> {
    const data = {user:state.user, startedAt:state.startedAt, finishedAt:Date.now(), total:total, attempted:attempted, correct:correct, wrong:wrong, unattempted:unattempted, score:score, review:review};
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`PrelimsPrecise_March2025_${state.user.replace(/\\s+/g,'_')}.json`; a.click(); URL.revokeObjectURL(url);
  };
  reviewBox.appendChild(exportBtn);
}

</script>
</body>
</html>
